name: Claude Code Review

on:
  # Без synchronize: ревью не перезапускается на каждый коммит (в т.ч. автоправки
  # openronin) — экономит минуты Actions. Триггерится на открытие PR, перевод из
  # черновика в готовый и переоткрытие. Для повторного ревью — reopen/ready.
  pull_request:
    types: [opened, ready_for_review, reopened]

# Один PR — одно ревью: при быстром ready→draft→ready отменяем предыдущий прогон,
# экономя минуты Actions и стоимость Claude-ревью. Все события здесь — только PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Черновики не ревьюим: openronin открывает PR черновиком (draft_pr: true), и без
    # этого гейта ревью прогонялось бы на недописанном коде на opened. Так ревью идёт
    # один раз — когда PR готов (ready_for_review) или открыт сразу не черновиком.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # Из всех джоб эта зависает охотнее прочих: агент ходит по сети и крутит цикл, у
    # которого нет собственного потолка. Наблюдаемые прогоны — 2,5–5 минут, поэтому 20
    # даёт четырёхкратный запас к самому долгому и оставляет место крупному PR. Лимит
    # выше, чем у джоб CI, намеренно: там время предсказуемо, здесь — нет.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты — Senior QA / Security Engineer.

            Отревьюй этот pull request. Отвечай по-русски.

            Контекст репозитория (anime-db-plugin-contracts):
            Это пакет-КОНТРАКТ плагинов AnimeDB v2: интерфейсы, плоские DTO, разбор
            `manifest.json` и PHPStan-правила, которыми потребители проверяют код
            плагинов. Реализации плагинов и бизнес-логики хоста здесь нет и быть не
            должно. Контракт реализуют две независимые стороны — хост-приложение и
            плагины (официальные и от сообщества), — поэтому любое изменение
            сигнатуры или семантики расходится по обеим и ломает уже опубликованные
            плагины. Цена ошибки выше, чем в приложении: чинится она релизом пакета и
            правками у всех потребителей.

            Ищи в первую очередь реальные проблемы:
            - Совместимость и семвер: изменение сигнатуры существующего интерфейса —
              минимум minor, удаление метода или несовместимое изменение — major.
              Молчаливое ужесточение типов/нуллабельности/возвращаемого значения —
              такой же слом, как удаление метода. Проверяй, что PR честно называет
              себя ломающим, если он ломающий.
            - Корректность: делает ли изменение то, что заявлено; логические ошибки,
              off-by-one, разыменование null, несоответствие типов, неверные regex.
            - Безопасность: невалидированный ввод на границах разбора `manifest.json`
              (это данные из чужого PR сообщества), path traversal в путях манифеста
              и ассетов, слишком доверчивый разбор JSON.
            - Достоверность тестов: тест, который прошёл бы и на СЛОМАННОМ коде, —
              это критичный дефект, а не мелочь. Ассерты обязаны различать
              корректное и ошибочное поведение. Типичные ловушки: стаб/фикстура
              возвращает то же значение, что раньше было захардкожено (или
              совпадает с «настоящим» литералом) — тогда тест не доказывает, что
              значение реально пришло из инъекции/проводки; тавтологичные ассерты;
              проверка, которая прошла бы при любой реализации. Отдельно у PHPStan-
              правил: тест правила обязан краснеть на сломанном правиле — проверь,
              что фикстура действительно содержит и нарушающий, и чистый случай.

            Специфика «формы контракта» — проверяй на соответствие:
            - Контракт не знает про хост. Ни один тип пакета не может ссылаться на
              ORM-сущности, схему БД, Symfony/Doctrine или внутреннее устройство
              хост-приложения. Новые DTO — плоские и без внешних рантайм-зависимостей.
              Флагай появление таких зависимостей в `require` composer.json.
            - Направление зависимости одностороннее: и хост, и плагины зависят от
              этого пакета, он — ни от кого из них.
            - Реализации конкретных плагинов (Shikimori/MAL/AniDB и т.п.) сюда не
              добавляются — это отдельные репозитории.
            - Интерфейсы role-named и разделены по ISP: у каждой фичи (filler /
              widget / sync / search / download) свой интерфейс, универсальной базы,
              к которой прирастают неуниверсальные допущения, нет. Флагай
              «god-интерфейс» и смешение логики разных фич в одном.
            - Манифестные `name`/`description` — самодостаточные литералы, а НЕ ключи
              перевода: манифест читается каталог-агностично (сборка реестра маркета,
              UI установки до активации плагина, валидатор). Локализуемые строки —
              только `WidgetMetadata.titleKey`/`descriptionKey` и лейблы UI-класса.
            - `ManifestValidator` намеренно НЕ является строгой схемой: схема
              `manifest.json` расширяется потребителями за пределами контракта
              (реестр маркета, тулинг монорепо плагинов). Отклонение любого поля вне
              фиксированного списка — регрессия, а не ужесточение.
            - `ManifestValidator` возвращает структурированный список ошибок
              (`field` + `message`), а не булев результат: оба потребителя показывают
              автору плагина причину отказа.
            - Лицензионная GPLv3-шапка обязана быть в КАЖДОМ исходном файле.
              Исключение — фикстуры PHPStan-правил под `tests/PHPStan/Rules/data/`:
              они намеренно исключены из php-cs-fixer и содержат синтаксис, который
              проверяют сами правила; требовать шапку там не нужно.
            - Минимальная версия PHP пакета — 8.5, она приведена к версии, которую
              везёт хост. Понижать её или возвращать матрицу старых версий не нужно.

            Не флагай: стилевые придирки, которые ловит линтер проекта (php-cs-fixer
            здесь настроен как `@Symfony` + `declare_strict_types` + запрет
            Yoda-условий и правит их сам, а `composer cs-check` падает на нарушении);
            гипотетические будущие проблемы, не относящиеся к этому PR.

            Калибровка серьёзности: НЕ занижай находки по корректности, безопасности
            и достоверности тестов до «мелочь / не блокер». Если тест не доказывает
            заявленное поведение, либо дефект может привести к неверному результату,
            утечке или регрессии — это блокирующее замечание (must-fix). Формулируй
            его прямо, как «нужно исправить», чтобы openronin однозначно взял его в
            работу, а не проигнорировал как необязательное.

            Публикуй замечания inline-комментариями к соответствующим строкам.

            В КОНЦЕ ревью ОБЯЗАТЕЛЬНО оставь ровно один итоговый комментарий
            через `gh pr comment` — это обязательный завершающий шаг, не пропускай
            его ни при каком исходе:
            - если нашёл замечания — краткая сводка (сколько, где, суть);
            - если существенных проблем нет — коротко подтверди: «✅ Существенных
              проблем не найдено».
            Без этого комментария ревью считается незавершённым.

            Итоговый комментарий публикуй ОДНОЙ командой вида
            `gh pr comment <N> --body '<текст>'` (или `--body "<текст>"`), БЕЗ heredoc
            и БЕЗ подстановки команд `$(...)`: подстановка команд запрещена настройками
            прав и вызовет отказ, из-за которого комментарий не опубликуется.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
